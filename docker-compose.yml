services:
  api_closing:
    container_name: api_closing
    image: api_closing:local
    build: .
    environment:
      - NODE_ENV=development
      - POSTGRES_HOST=api_closing_pg
      - POSTGRES_PORT=5432
      - POSTGRES_DATABASE_NAME=postgres
      - POSTGRES_USERNAME=admin
      - POSTGRES_PASSWORD=admin
      - JWT_SECRET=example
      - JWT_SECRET_EXPIRES_IN=50d
      - API_PORT=8080
    ports:
      - 8080:8080
    volumes:
      - .:/var/www
      - /var/www/node_modules
    depends_on:
      - api_closing_pg
    networks:
      - my-network
    command: /bin/sh
    stdin_open: true
    tty: true

  api_closing_pg:
    container_name: api_closing_pg
    image: postgres:latest
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    expose:
      - 5432
    ports:
      - 5432:5432
    command: -p 5432
    networks:
      - my-network

networks:
  my-network:
    driver: bridge