<div
  class="grid grid-cols-4 xs:grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 p-4"
>
  <div
    (click)="addNewNodeTree()"
    class="flex flex-col justify-center items-center cursor-pointer max-w-sm p-6 bg-white border border-gray-200 rounded-lg shadow-sm hover:bg-gray-100 dark:bg-gray-800 dark:border-gray-700 dark:hover:bg-gray-700"
  >
    <i class="fas fa-plus-circle text-4xl"></i>
    <p class="font-normal text-gray-700 dark:text-gray-400 mt-2">
      Add New Tree
    </p>
  </div>

  @for(item of treeNodeList; track item.id) {
  <div
    (click)="selectNodeTree(item)"
    class="block cursor-pointer max-w-sm p-6 bg-white border border-gray-200 rounded-lg shadow-sm hover:bg-gray-100 dark:bg-gray-800 dark:border-gray-700 dark:hover:bg-gray-700"
  >
    <h5
      class="mb-2 text-2xl font-bold tracking-tight text-gray-900 dark:text-white"
    >
      Noteworthy technology acquisitions 2021
    </h5>
    <p class="font-normal text-gray-700 dark:text-gray-400">
      Here are the biggest enterprise technology acquisitions of 2021 so far, in
      reverse chronological order.
    </p>
  </div>
  }
</div>
