<div class="h-full bg-gray-50">
  <div class="flex flex-col h-full">
    <div class="flex-grow border-gray-200 dark:border-gray-700">
      <div class="card h-full w-full" #treeContainer></div>
    </div>

    <div
      class="absolute flex items-center top-4 left-1/2 -translate-x-1/2 rounded-lg bg-white shadow-lg dark:bg-gray-800 border-gray-200 dark:border-gray-700 p-4"
    >
      <p-button
        icon="pi pi-chevron-circle-left"
        [rounded]="true"
        [text]="true"
        [pTooltip]="'Back'"
        severity="secondary"
        [tooltipPosition]="'bottom'"
        (onClick)="goBack()"
      />

      <form [formGroup]="nodeForm">
        <input
          pInputText
          type="text"
          class="p-inputtext-sm"
          formControlName="title"
          placeholder="New tree title"
        />
      </form>
    </div>

    <div
      class="absolute bottom-4 left-1/2 -translate-x-1/2 rounded-lg bg-white shadow-lg dark:bg-gray-800 border-gray-200 dark:border-gray-700 p-4"
    >
      <div class="flex items-center justify-center space-x-4">
        <p-button
          icon="pi pi-plus"
          severity="secondary"
          [size]="'small'"
          [pTooltip]="'Add Node'"
          [tooltipPosition]="'top'"
          (onClick)="addNode()"
        />
        <p-button
          icon="pi pi-sparkles"
          severity="help"
          [size]="'small'"
          [pTooltip]="'AI Beta'"
          [tooltipPosition]="'top'"
          (onClick)="openAIChat()"
        />
        <p-button
          icon="pi pi-sparkles"
          severity="help"
          [size]="'small'"
          [pTooltip]="'AI Beta'"
          [tooltipPosition]="'top'"
          (onClick)="openAIChat()"
        />

        <p-button
          icon="pi pi-sparkles"
          severity="help"
          [size]="'small'"
          [pTooltip]="'AI Beta'"
          [tooltipPosition]="'top'"
          (onClick)="openAIChat()"
        />
        <p-button
          icon="pi pi-trash"
          [size]="'small'"
          [pTooltip]="'Delete'"
          [tooltipPosition]="'top'"
          severity="secondary"
          (onClick)="removeNode()"
        />
      </div>
    </div>

    <div
      class="absolute bottom-0 right-0 rounded-lg space-x-2 bg-white shadow-lg dark:bg-gray-800 border-gray-200 dark:border-gray-700 p-2"
    >
      <p-button
        icon="pi pi-plus"
        severity="secondary"
        [size]="'small'"
        [pTooltip]="'Zoom In'"
        [tooltipPosition]="'top'"
        (onClick)="zoomIn()"
      />
      <p-button
        icon="pi pi-minus"
        severity="secondary"
        [size]="'small'"
        [pTooltip]="'Zoom Out'"
        [tooltipPosition]="'top'"
        (onClick)="zoomOut()"
      />
      <p-button
        icon="pi pi-refresh"
        severity="secondary"
        [size]="'small'"
        [pTooltip]="'Rotate'"
        [tooltipPosition]="'top'"
        (onClick)="rotate()"
      />
    </div>
  </div>
</div>
