<div class="h-full">
  <div class="flex flex-col h-full">
    <div class="flex-grow border-gray-200 dark:border-gray-700">
      <div class="card h-full w-full" #treeContainer></div>
    </div>

    <div
      class="absolute flex items-center space-x-4 top-4 left-1/2 -translate-x-1/2 rounded-lg bg-white shadow-lg dark:bg-gray-900 border-gray-200 dark:border-gray-700 p-4"
    >
      <div class="flex items-center space-x-2">
        <p-button
          icon="pi pi-chevron-circle-left"
          [rounded]="true"
          [text]="true"
          [pTooltip]="'Back'"
          severity="secondary"
          [tooltipPosition]="'bottom'"
          (onClick)="goBack()"
        />

        <form [formGroup]="nodeForm">
          <input
            pInputText
            type="text"
            class="p-inputtext-sm"
            formControlName="title"
            placeholder="New tree title"
          />
        </form>
      </div>

      <div class="flex items-center justify-center space-x-2">
        <p-button
          icon="fas fa-download"
          [size]="'small'"
          [pTooltip]="
            editedTree._id
              ? 'Export'
              : 'Your tree must be saved before downloading it'
          "
          [tooltipPosition]="'top'"
          severity="secondary"
          [disabled]="!editedTree._id"
          (onClick)="export()"
        >
        </p-button>
        <p-button
          icon="pi pi-save"
          [size]="'small'"
          [pTooltip]="'Save'"
          [tooltipPosition]="'top'"
          severity="secondary"
          (onClick)="save()"
        />
        <p-button
          icon="pi pi-trash"
          [size]="'small'"
          [pTooltip]="'Delete'"
          [tooltipPosition]="'top'"
          severity="secondary"
          (onClick)="deleteDialogVisible = true"
        />
      </div>

      <p-divider layout="vertical" />

      <div class="flex items-center">
        <p-button
          icon="pi pi-sparkles"
          severity="help"
          [size]="'small'"
          [pTooltip]="'AI Beta'"
          [tooltipPosition]="'top'"
          (onClick)="openAIChat()"
        />
      </div>
    </div>

    <!-- Main Toolbar Buttons -->
    <div
      class="absolute bottom-4 left-1/2 -translate-x-1/2 rounded-lg bg-white shadow-lg dark:bg-gray-900 border-gray-200 dark:border-gray-700 p-4"
    >
      <div class="flex space-x-2">
        <p-button
          icon="pi pi-plus"
          severity="secondary"
          [size]="'small'"
          [pTooltip]="'Add Node'"
          [tooltipPosition]="'left'"
          (onClick)="addNode()"
        />
        <p-button
          icon="pi pi-file-plus"
          severity="secondary"
          [size]="'small'"
          [pTooltip]="'Add File'"
          [tooltipPosition]="'left'"
          [disabled]="!selectedNode"
          (onClick)="addFileToNode()"
        />
        <p-button
          icon="fas fa-list-check"
          severity="secondary"
          [size]="'small'"
          [pTooltip]="'Add To Do List'"
          [tooltipPosition]="'left'"
          [disabled]="!selectedNode"
          (onClick)="addTodoListToNode()"
        />
        <p-button
          icon="fas fa-file-lines"
          severity="secondary"
          [size]="'small'"
          [pTooltip]="'Add Form'"
          [tooltipPosition]="'left'"
          [disabled]="!selectedNode"
          (onClick)="addFormToNode()"
        />
        <p-button
          icon="pi pi-trash"
          [size]="'small'"
          [pTooltip]="'Delete'"
          [tooltipPosition]="'left'"
          severity="secondary"
          [disabled]="!selectedNode"
          (onClick)="deleteNode()"
        />
      </div>
    </div>

    <!-- Zoom Buttons -->
    <div
      class="absolute bottom-0 right-0 rounded-lg space-x-2 bg-white shadow-lg dark:bg-gray-900 border-gray-200 dark:border-gray-700 p-2"
    >
      <i
        class="pi pi-plus cursor-pointer text-gray-500 hover:text-gray-700 bg-gray-100 p-2 rounded-lg"
        [pTooltip]="'Zoom In'"
        [tooltipPosition]="'top'"
        style="font-size: 0.8rem"
        (click)="zoomIn()"
      ></i>
      <i
        class="pi pi-minus cursor-pointer text-gray-500 hover:text-gray-700 bg-gray-100 p-2 rounded-lg"
        [pTooltip]="'Zoom Out'"
        [tooltipPosition]="'top'"
        style="font-size: 0.8rem"
        (click)="zoomOut()"
      ></i>
      <i
        class="pi pi-refresh cursor-pointer text-gray-500 hover:text-gray-700 bg-gray-100 p-2 rounded-lg"
        [pTooltip]="'Rotate'"
        [tooltipPosition]="'top'"
        style="font-size: 0.8rem"
        (click)="rotate()"
      ></i>
    </div>
  </div>
</div>
m

<p-dialog
  header="Delete Tree"
  [modal]="true"
  [(visible)]="deleteDialogVisible"
  [style]="{ width: '25rem' }"
>
  <span class="p-text-secondary block mb-8"
    >Are you sure you want to delete this tree?</span
  >
  <div class="flex justify-end gap-2">
    <p-button
      label="Cancel"
      severity="secondary"
      (click)="deleteDialogVisible = false"
    />
    <p-button label="Delete" severity="danger" (click)="deleteTree()" />
  </div>
</p-dialog>
