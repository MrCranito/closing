<div class="sitemap-builder">
  <!-- Toolbar -->
  <div class="toolbar">
    <button (click)="addPage()" class="toolbar-btn">
      <i class="fas fa-file"></i> Add Page
    </button>
    <button (click)="addForm()" class="toolbar-btn">
      <i class="fas fa-wpforms"></i> Add Form
    </button>
    <button (click)="addImage()" class="toolbar-btn">
      <i class="fas fa-image"></i> Add Image
    </button>
    <button (click)="addFile()" class="toolbar-btn">
      <i class="fas fa-file-alt"></i> Add File
    </button>
    <button (click)="addTodo()" class="toolbar-btn">
      <i class="fas fa-tasks"></i> Add Todo
    </button>
    <button (click)="deleteNode()" class="toolbar-btn delete">
      <i class="fas fa-trash"></i> Delete
    </button>
    <button (click)="exportSitemap()" class="toolbar-btn export">
      <i class="fas fa-download"></i> Export
    </button>
  </div>

  <!-- Sitemap Container -->
  <div #sitemapContainer class="sitemap-container"></div>
</div>
