<div class="h-full">
  <div class="flex flex-col h-full">
    <div class="flex-grow border-gray-200 dark:border-gray-700">
      <div class="card h-full w-full" #diagramContainer></div>
    </div>

    <div
      class="absolute flex items-center space-x-4 top-4 left-1/2 -translate-x-1/2 rounded-lg bg-white shadow-lg dark:bg-gray-900 border-gray-200 dark:border-gray-700 p-4"
    >
      <div class="flex items-center space-x-2">
        <p-button
          icon="fas fa-chevron-circle-left"
          [rounded]="true"
          [text]="true"
          [pTooltip]="'Back'"
          severity="secondary"
          [tooltipPosition]="'bottom'"
          (onClick)="goBack()"
        />

        <form [formGroup]="form">
          <input
            pInputText
            id="on_name"
            formControlName="name"
            placeholder="Title..."
            autocomplete="off"
          />
        </form>
      </div>

      <div class="flex items-center justify-center space-x-2">
        <p-button
          icon="fas fa-download"
          [size]="'small'"
          [pTooltip]="
            editedDiagram._id
              ? 'Export'
              : 'Your diagram must be saved before downloading it'
          "
          [tooltipPosition]="'top'"
          severity="secondary"
          [disabled]="!editedDiagram._id"
          (onClick)="export()"
        >
        </p-button>
        <p-button
          icon="fas fa-save"
          [size]="'small'"
          [pTooltip]="'Save'"
          [tooltipPosition]="'top'"
          severity="secondary"
          [disabled]="!form.controls['name'].value"
          (onClick)="save()"
        />
        <p-button
          icon="fas fa-undo"
          [size]="'small'"
          [pTooltip]="'Reset'"
          [tooltipPosition]="'top'"
          severity="secondary"
          [disabled]="!isEqual"
          (onClick)="resetTree()"
        />
        <p-button
          icon="fas fa-trash"
          [size]="'small'"
          [pTooltip]="'Delete'"
          [tooltipPosition]="'top'"
          severity="secondary"
          (onClick)="deleteDialogVisible = true"
        />
      </div>

      <p-divider layout="vertical" />

      <div class="flex items-center">
        <p-button
          icon="fas fa-robot"
          severity="help"
          [size]="'small'"
          [pTooltip]="'AI Beta'"
          [tooltipPosition]="'top'"
          [disabled]="true"
          (onClick)="openAIChat()"
        />
      </div>
    </div>

    <!-- Main Toolbar Buttons -->
    <div
      class="absolute bottom-4 left-1/2 -translate-x-1/2 rounded-lg bg-white shadow-lg dark:bg-gray-900 border-gray-200 dark:border-gray-700 p-4"
    >
      <div class="flex flex-col space-y-2">
        <!-- Node Actions -->
        <div class="flex space-x-2">
          <p-button
            icon="fas fa-plus"
            severity="secondary"
            [size]="'small'"
            [pTooltip]="'Add Node'"
            [tooltipPosition]="'left'"
            (onClick)="addNode()"
            [disabled]="!selectedNode"
          />
          <p-button
            #widgetBtn
            icon="fas fa-th-large"
            severity="secondary"
            [size]="'small'"
            [pTooltip]="'Add Widget'"
            [tooltipPosition]="'left'"
            [disabled]="!selectedNode"
            (click)="widgetMenu.toggle($event)"
          />
          <p-button
            icon="fas fa-bolt"
            severity="secondary"
            [size]="'small'"
            [pTooltip]="'Add Automatique Action'"
            [tooltipPosition]="'left'"
            [disabled]="!selectedNode"
            (click)="actionMenu.toggle($event)"
          />
          <p-button
            icon="fas fa-trash"
            [size]="'small'"
            [pTooltip]="'Delete'"
            [tooltipPosition]="'left'"
            severity="secondary"
            [disabled]="!selectedNode || isRootNode"
            (onClick)="removeNode()"
          />
        </div>
      </div>
    </div>

    <p-menu
      #widgetMenu
      [popup]="true"
      [model]="widgetItems"
      [appendTo]="'body'"
    ></p-menu>

    <p-menu
      #actionMenu
      [popup]="true"
      [model]="actionItems"
      [appendTo]="'body'"
    ></p-menu>

    <!-- Zoom Buttons -->
    <div
      class="absolute bottom-0 right-0 rounded-lg space-x-2 bg-white shadow-lg dark:bg-gray-900 border-gray-200 dark:border-gray-700 p-2"
    >
      <i
        class="fas fa-plus cursor-pointer text-gray-500 hover:text-gray-700 bg-gray-100 p-2 rounded-lg"
        [pTooltip]="'Zoom In'"
        [tooltipPosition]="'top'"
        style="font-size: 0.7rem"
        (click)="zoomIn()"
      ></i>
      <i
        class="fas fa-minus cursor-pointer text-gray-500 hover:text-gray-700 bg-gray-100 p-2 rounded-lg"
        [pTooltip]="'Zoom Out'"
        [tooltipPosition]="'top'"
        style="font-size: 0.7rem"
        (click)="zoomOut()"
      ></i>
      <i
        class="fas fa-sync cursor-pointer text-gray-500 hover:text-gray-700 bg-gray-100 p-2 rounded-lg"
        [pTooltip]="'Rotate'"
        [tooltipPosition]="'top'"
        style="font-size: 0.7rem"
        (click)="rotate()"
      ></i>
    </div>
  </div>
</div>

<p-dialog
  header="Delete Diagram"
  [modal]="true"
  [(visible)]="deleteDialogVisible"
  [style]="{ width: '25rem' }"
>
  <span class="p-text-secondary block mb-8"
    >Are you sure you want to delete this diagram?</span
  >
  <div class="flex justify-end gap-2">
    <p-button
      label="Cancel"
      severity="secondary"
      (click)="deleteDialogVisible = false"
    />
    <p-button label="Delete" severity="danger" (click)="deleteTree()" />
  </div>
</p-dialog>
